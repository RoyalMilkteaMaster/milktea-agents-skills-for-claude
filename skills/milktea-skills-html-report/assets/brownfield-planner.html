<!doctype html>
<html lang="zh-Hant" data-report-profile="brownfield-planner" data-report-status="ready-for-decision">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{專案名稱}}｜架構健檢決策報告</title>
  <style>
    :root {
      --夜藍: #132337;
      --石板: #334155;
      --霧白: #f3f5f7;
      --紙白: #ffffff;
      --琥珀: #d99116;
      --警示: #a63f2f;
      --青藍: #16788a;
      --線條: #d7dde4;
      --淡字: #607080;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--夜藍); background: var(--霧白); font-family: "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.65; }
    .頁面 { width: min(1220px, calc(100% - 36px)); margin: 0 auto; padding: 32px 0 64px; }
    .稽核頁首 { display: grid; grid-template-columns: 1.55fr .8fr; overflow: hidden; border-radius: 22px; background: var(--夜藍); color: white; box-shadow: 0 20px 45px rgba(19, 35, 55, .16); }
    .標題區 { padding: 44px; }
    .標題區 p { max-width: 720px; color: #c9d6e4; }
    .決策盒 { display: grid; align-content: center; gap: 12px; padding: 32px; background: linear-gradient(145deg, #1e3a54, #14283d); border-left: 1px solid rgba(255,255,255,.14); }
    .眉題 { margin: 0 0 8px; color: #f5c66e; font-size: .82rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.8rem); line-height: 1.08; }
    .決策狀態 { padding: 14px 16px; border-left: 5px solid var(--琥珀); border-radius: 8px; background: rgba(255,255,255,.1); }
    .決策狀態 small { display: block; color: #b9c7d4; }
    .決策狀態 strong { font-size: 1.15rem; }
    main { display: grid; gap: 18px; margin-top: 20px; }
    section { padding: 30px; border: 1px solid var(--線條); border-radius: 16px; background: var(--紙白); box-shadow: 0 10px 28px rgba(33, 45, 58, .06); }
    h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 1.55rem; }
    h2::before { content: ""; width: 8px; height: 30px; border-radius: 5px; background: var(--琥珀); }
    .指標列, .雙欄, .三欄 { display: grid; gap: 14px; }
    .指標列 { grid-template-columns: repeat(4, 1fr); }
    .雙欄 { grid-template-columns: repeat(2, 1fr); }
    .三欄 { grid-template-columns: repeat(3, 1fr); }
    .卡片 { padding: 17px; border: 1px solid var(--線條); border-radius: 12px; background: #fbfcfd; }
    .卡片 small { color: var(--淡字); }
    .卡片 strong { display: block; margin-top: 4px; font-size: 1.25rem; }
    .風險 { border-top: 4px solid var(--警示); }
    .證據 { border-left: 4px solid var(--青藍); }
    .比較 { overflow-x: auto; border: 1px solid var(--線條); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--線條); text-align: left; vertical-align: top; }
    th { background: #eaf0f4; }
    .圖表 { min-height: 170px; padding: 18px; border-radius: 12px; background: linear-gradient(135deg, #eef3f6, #f9fafb); }
    details { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--線條); }
    summary { color: var(--青藍); cursor: pointer; font-weight: 800; }
    .決策列 { display: flex; flex-wrap: wrap; gap: 10px; }
    .選項 { padding: 12px 16px; border: 1px solid var(--線條); border-radius: 999px; background: #f7f9fa; font-weight: 800; }
    footer { padding: 22px 4px; color: var(--淡字); }
    @media (max-width: 820px) { .稽核頁首, .指標列, .雙欄, .三欄 { grid-template-columns: 1fr; } .決策盒 { border-left: 0; border-top: 1px solid rgba(255,255,255,.14); } }
  </style>
</head>
<body>
  <div class="頁面">
    <header class="稽核頁首">
      <div class="標題區">
        <p class="眉題">既有系統｜架構健檢</p>
        <h1>{{專案名稱}}<br>架構健檢決策報告</h1>
        <p>{{首屏摘要}}</p>
      </div>
      <aside class="決策盒">
        <div class="決策狀態"><small>是否值得重構</small><strong>{{重構判斷}}</strong></div>
        <div class="決策狀態"><small>推薦方案</small><strong>{{推薦方案}}</strong></div>
        <div class="決策狀態"><small>最大風險</small><strong>{{最大風險}}</strong></div>
        <div class="決策狀態"><small>設計輔助</small><strong id="design-assist">{{設計輔助}}</strong></div>
      </aside>
    </header>

    <main>
      <section id="決策摘要">
        <h2>決策摘要</h2>
        {{決策摘要內容}}
      </section>
      <section id="現況架構與資料流">
        <h2>現況架構與資料流</h2>
        {{現況系統內容}}
      </section>
      <section id="問題與清理候選">
        <h2>問題與清理候選</h2>
        {{清理候選內容}}
      </section>
      <section id="改善方案">
        <h2>改善方案比較</h2>
        {{改善方案內容}}
      </section>
      <section id="相容性與決策">
        <h2>相容性與待決策事項</h2>
        {{相容性與決策內容}}
      </section>
    </main>

    <footer>基準版本：{{基準版本}}　｜　產生時間：{{產生時間}}</footer>
  </div>
</body>
</html>
