<!doctype html>
<html lang="zh-Hant" data-report-profile="{{呼叫者識別}}" data-report-status="pass" data-work-id="{{工作識別碼}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{顯示名稱}}｜{{報告類型}}</title>
  <style>
    :root {
      color-scheme: light;
      --背景: #f3f6f4;
      --卡片: #ffffff;
      --文字: #17332d;
      --次要: #62736d;
      --主色: #176b55;
      --主色淡: #dff3eb;
      --輔色: #173f69;
      --警示: #9a5a10;
      --邊線: #d9e2de;
      --陰影: 0 14px 34px rgba(23, 51, 45, .09);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--文字); background: var(--背景); font-family: "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.65; }
    main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 64px; }
    header, section { background: var(--卡片); border: 1px solid var(--邊線); border-radius: 18px; box-shadow: var(--陰影); }
    header { padding: 30px; }
    section { margin-top: 20px; padding: 26px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(1.9rem, 4vw, 3.2rem); line-height: 1.2; }
    h2 { margin-bottom: 18px; font-size: 1.3rem; }
    .眉題 { margin-bottom: 7px; color: var(--主色); font-weight: 800; letter-spacing: .08em; }
    .識別 { margin: 0; color: var(--次要); overflow-wrap: anywhere; }
    .通過 { display: inline-flex; margin-top: 18px; padding: 7px 13px; border-radius: 999px; background: var(--主色淡); color: var(--主色); font-weight: 900; }
    .摘要 { margin-top: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .摘要 article { padding: 16px; border-radius: 14px; border: 1px solid var(--邊線); background: #f8faf9; }
    .摘要 small { display: block; color: var(--次要); }
    .摘要 strong { display: block; margin-top: 5px; font-size: 1.15rem; overflow-wrap: anywhere; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid var(--邊線); text-align: left; vertical-align: top; }
    th { color: var(--次要); font-size: .92rem; }
    .證據 { margin-top: 16px; }
    .動態文字 { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; color: inherit; }
    .驗收狀態 { margin-bottom: 14px; padding: 10px 13px; border-radius: 12px; background: var(--主色淡); color: var(--主色); font-weight: 800; }
    details { border: 1px solid var(--邊線); border-radius: 12px; padding: 12px 15px; }
    summary { cursor: pointer; color: var(--輔色); font-weight: 800; }
    .確認摘要 { margin-bottom: 14px; color: var(--次要); }
    .確認清單 { display: grid; gap: 10px; }
    .確認項目 { display: flex; align-items: flex-start; gap: 10px; padding: 13px; border: 1px solid var(--邊線); border-radius: 12px; }
    .確認項目 input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--主色); }
    .確認項目 label { flex: 1; }
    #design-assist { margin-top: 24px; color: var(--次要); font-size: .9rem; }
    a { color: var(--輔色); }
    code { overflow-wrap: anywhere; }
    @media (max-width: 760px) {
      .摘要 { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header id="結論">
      <p class="眉題">不可變結案紀錄</p>
      <h1>{{顯示名稱}}</h1>
      <p class="識別">工作識別碼：{{工作識別碼}}｜{{報告類型}}</p>
      <div class="通過">{{最終結論}}</div>
      <div class="摘要">
        <article><small>原始需求</small><strong>{{需求完成摘要}}</strong></article>
        <article><small>Tickets</small><strong>{{Ticket完成摘要}}</strong></article>
        <article><small>原生瀏覽器驗收</small><strong>{{瀏覽器驗收摘要}}</strong></article>
      </div>
      <pre class="動態文字" data-dynamic-text="結論內容">{{結論內容}}</pre>
    </header>

    <section id="原始需求">
      <h2>{{原始需求標題}}</h2>
      <pre class="動態文字" data-dynamic-text="原始需求內容">{{原始需求內容}}</pre>
    </section>

    <section id="Ticket成果">
      <h2>Ticket 成果與 Review</h2>
      <pre class="動態文字" data-dynamic-text="Ticket成果內容">{{Ticket成果內容}}</pre>
    </section>

    <section id="實際驗收" data-evidence="browser-acceptance">
      <h2>實際驗收與證據</h2>
      <div class="驗收狀態" data-evidence="final-acceptance" data-result="通過">最終總驗收：通過</div>
      <pre class="動態文字" data-dynamic-text="實際驗收內容">{{實際驗收內容}}</pre>
      <div class="證據"><pre class="動態文字" data-dynamic-text="詳細證據">{{詳細證據}}</pre></div>
    </section>

    <section id="風險與回復">
      <h2>未解風險與回復方式</h2>
      <pre class="動態文字" data-dynamic-text="風險與回復內容">{{風險與回復內容}}</pre>
    </section>

    <section id="使用者確認" data-user-checklist>
      <h2>使用者逐項確認清單</h2>
      <p id="確認進度" class="確認摘要" role="status" aria-live="polite"></p>
      <div class="確認清單">{{使用者確認項目}}</div>
    </section>

    <div id="design-assist">{{設計輔助}}</div>
  </main>
  <script>
    const 工作識別碼 = document.documentElement.dataset.workId;
    const 儲存鍵 = `milktea-completion-checklist:${工作識別碼}`;
    const 項目 = [...document.querySelectorAll("input[type='checkbox'][data-requirement-id]")];
    let 已保存 = {};
    try { 已保存 = JSON.parse(localStorage.getItem(儲存鍵) || "{}"); } catch (_) { 已保存 = {}; }
    for (const 方框 of 項目) {
      方框.checked = Boolean(已保存[方框.dataset.requirementId]);
      方框.addEventListener("change", 更新確認);
    }
    function 更新確認() {
      const 狀態 = Object.fromEntries(項目.map((方框) => [方框.dataset.requirementId, 方框.checked]));
      try { localStorage.setItem(儲存鍵, JSON.stringify(狀態)); } catch (_) { /* 本機瀏覽器可能停用儲存 */ }
      const 已確認 = 項目.filter((方框) => 方框.checked).length;
      document.getElementById("確認進度").textContent = `已確認 ${已確認}／${項目.length} 項；此清單供使用者清點，不會改寫結案證據。`;
    }
    更新確認();
  </script>
</body>
</html>
