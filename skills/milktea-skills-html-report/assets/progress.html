<!doctype html>
<html lang="zh-Hant" data-report-profile="progress" data-report-status="{{報告狀態}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{顯示名稱}}｜工作進度</title>
  <style>
    :root {
      color-scheme: light;
      --背景: #f3f6f4;
      --卡片: #ffffff;
      --文字: #17332d;
      --次要: #64756f;
      --主色: #176b55;
      --主色淡: #dff3eb;
      --警示: #9a5a10;
      --警示淡: #fff0d6;
      --錯誤: #9d2c2c;
      --錯誤淡: #fde5e5;
      --邊線: #d9e2de;
      --陰影: 0 12px 30px rgba(23, 51, 45, 0.08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--文字); background: var(--背景); font-family: "Microsoft JhengHei", system-ui, sans-serif; line-height: 1.6; }
    main { width: min(1180px, calc(100% - 32px)); margin: 28px auto 60px; }
    header, section { background: var(--卡片); border: 1px solid var(--邊線); border-radius: 18px; box-shadow: var(--陰影); }
    header { padding: 28px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(1.8rem, 4vw, 3rem); }
    h2 { margin-bottom: 18px; font-size: 1.25rem; }
    h3 { margin-bottom: 6px; font-size: 1.05rem; }
    .眉題 { margin-bottom: 6px; color: var(--主色); font-weight: 800; letter-spacing: .08em; }
    .識別 { margin: 0; color: var(--次要); word-break: break-all; }
    .連線 { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 6px 12px; border-radius: 999px; background: var(--主色淡); color: var(--主色); font-weight: 700; }
    .連線::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
    .連線.離線 { background: #ecefed; color: var(--次要); }
    .摘要 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 24px; }
    .摘要 article { padding: 16px; border-radius: 14px; background: #f7faf8; border: 1px solid var(--邊線); }
    .摘要 small { display: block; color: var(--次要); }
    .摘要 strong { display: block; margin-top: 5px; font-size: 1.15rem; overflow-wrap: anywhere; }
    section { margin-top: 20px; padding: 24px; }
    .進度條 { height: 12px; overflow: hidden; border-radius: 999px; background: #e6ece9; }
    .進度條 span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--主色); transition: width .25s ease; }
    .票卡列表 { display: grid; gap: 14px; }
    .票卡 { padding: 18px; border: 1px solid var(--邊線); border-radius: 14px; }
    .票卡標頭 { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .狀態 { flex: 0 0 auto; padding: 4px 10px; border-radius: 999px; background: #edf2f0; color: var(--次要); font-size: .9rem; font-weight: 800; }
    .狀態.完成 { background: var(--主色淡); color: var(--主色); }
    .狀態.阻擋 { background: var(--錯誤淡); color: var(--錯誤); }
    .狀態.執行中, .狀態.Review中, .狀態.修正中 { background: var(--警示淡); color: var(--警示); }
    .欄位 { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin-top: 12px; }
    .欄位 dt { color: var(--次要); font-weight: 700; }
    .欄位 dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .阻擋區[hidden], .歷史區[hidden] { display: none; }
    .阻擋卡 { padding: 18px; border-left: 5px solid var(--錯誤); border-radius: 12px; background: var(--錯誤淡); white-space: pre-wrap; }
    .歷史列表 { margin: 0; padding-left: 1.3rem; }
    .歷史列表 li + li { margin-top: 8px; }
    a { color: var(--主色); font-weight: 700; }
    .空白 { margin: 0; color: var(--次要); }
    @media (max-width: 780px) {
      .摘要 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .欄位 { grid-template-columns: 1fr; }
      .欄位 dt { margin-top: 7px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="眉題">非同步工作進度</p>
      <h1 id="顯示名稱"></h1>
      <p class="識別">工作識別碼：<span id="工作識別碼"></span></p>
      <div id="連線狀態" class="連線 離線" role="status" aria-live="polite">載入本機進度快照</div>
      <div class="摘要" aria-label="工作摘要">
        <article><small>總進度</small><strong id="總進度"></strong></article>
        <article><small>目前 Ticket</small><strong id="目前工作"></strong></article>
        <article><small>目前階段</small><strong id="目前階段"></strong></article>
        <article><small>最後更新</small><strong id="最後更新"></strong></article>
      </div>
    </header>

    <section aria-labelledby="進度標題">
      <h2 id="進度標題">Ticket 進度</h2>
      <div class="進度條" aria-hidden="true"><span id="進度條"></span></div>
      <div id="票卡列表" class="票卡列表" style="margin-top:18px"></div>
    </section>

    <section id="阻擋區" class="阻擋區" aria-labelledby="阻擋標題" hidden>
      <h2 id="阻擋標題">需要裁決的阻擋</h2>
      <div id="阻擋列表"></div>
    </section>

    <section id="歷史區" class="歷史區" aria-labelledby="歷史標題" hidden>
      <h2 id="歷史標題">過去的結案報告</h2>
      <ul id="歷史列表" class="歷史列表"></ul>
    </section>
  </main>

  <script>
    const 初始資料 = {{初始資料}};

    function 設定文字(識別, 內容) {
      document.getElementById(識別).textContent = 內容 || "—";
    }

    function 建立欄位(名稱, 內容) {
      const 標題 = document.createElement("dt");
      標題.textContent = 名稱;
      const 值 = document.createElement("dd");
      值.textContent = 內容 || "—";
      return [標題, 值];
    }

    function 更新頁面(資料) {
      document.documentElement.dataset.reportStatus = 資料.報告狀態 || "in-progress";
      document.title = `${資料.顯示名稱 || "未命名工作"}｜工作進度`;
      設定文字("顯示名稱", 資料.顯示名稱);
      設定文字("工作識別碼", 資料.工作識別碼);
      設定文字("總進度", `${資料.完成數 || 0}／${資料.總數 || 0} Tickets 完成`);
      設定文字("目前工作", 資料.目前工作);
      設定文字("目前階段", 資料.目前階段);
      設定文字("最後更新", 資料.最後更新);
      document.getElementById("進度條").style.width = `${資料.完成比例 || 0}%`;

      const 票卡列表 = document.getElementById("票卡列表");
      票卡列表.replaceChildren();
      if (!資料.Tickets || 資料.Tickets.length === 0) {
        const 空白 = document.createElement("p");
        空白.className = "空白";
        空白.textContent = "目前沒有可讀取的 Ticket。";
        票卡列表.appendChild(空白);
      } else {
        for (const Ticket of 資料.Tickets) {
          const 卡片 = document.createElement("article");
          卡片.className = "票卡";
          const 標頭 = document.createElement("div");
          標頭.className = "票卡標頭";
          const 標題 = document.createElement("h3");
          標題.textContent = `${Ticket.編號}｜${Ticket.名稱}`;
          const 狀態 = document.createElement("span");
          狀態.className = `狀態 ${String(Ticket.狀態 || "").replaceAll(" ", "")}`;
          狀態.textContent = Ticket.狀態 || "未知";
          標頭.append(標題, 狀態);
          const 欄位 = document.createElement("dl");
          欄位.className = "欄位";
          for (const [名稱, 內容] of [
            ["對應原始需求", Ticket.原始需求],
            ["Ticket 目的", Ticket.目標],
            ["目前紀錄", Ticket.目前紀錄],
            ["測試與 Review", Ticket.驗收摘要],
            ["品味評分", Ticket.品味評分],
            ["範圍與複雜度", Ticket.範圍警示],
            ["下一步", Ticket.下一步],
          ]) {
            欄位.append(...建立欄位(名稱, 內容));
          }
          卡片.append(標頭, 欄位);
          票卡列表.appendChild(卡片);
        }
      }

      const 阻擋區 = document.getElementById("阻擋區");
      const 阻擋列表 = document.getElementById("阻擋列表");
      阻擋列表.replaceChildren();
      阻擋區.hidden = !資料.阻擋 || 資料.阻擋.length === 0;
      for (const 內容 of 資料.阻擋 || []) {
        const 卡片 = document.createElement("div");
        卡片.className = "阻擋卡";
        卡片.textContent = 內容;
        阻擋列表.appendChild(卡片);
      }

      const 歷史區 = document.getElementById("歷史區");
      const 歷史列表 = document.getElementById("歷史列表");
      歷史列表.replaceChildren();
      歷史區.hidden = !資料.歷史報告 || 資料.歷史報告.length === 0;
      for (const 報告 of 資料.歷史報告 || []) {
        const 項目 = document.createElement("li");
        const 連結 = document.createElement("a");
        連結.href = location.protocol === "file:" ? 報告.本機連結 : 報告.連結;
        連結.textContent = 報告.名稱;
        項目.appendChild(連結);
        歷史列表.appendChild(項目);
      }
    }

    更新頁面(初始資料);

    if (location.protocol === "http:" || location.protocol === "https:") {
      const 連線狀態 = document.getElementById("連線狀態");
      const 事件來源 = new EventSource("/events");
      事件來源.addEventListener("progress", (事件) => 更新頁面(JSON.parse(事件.data)));
      事件來源.onopen = () => {
        連線狀態.className = "連線";
        連線狀態.textContent = "已連線，進度會非同步更新";
      };
      事件來源.onerror = () => {
        連線狀態.className = "連線 離線";
        連線狀態.textContent = "連線中斷，畫面保留最後進度";
      };
    }
  </script>
</body>
</html>
